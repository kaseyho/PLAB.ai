services:
  - type: web
    name: plab-ai
    runtime: python
    region: singapore
    plan: free
    buildCommand: uv sync --locked --no-dev && uv run python -m app.download_data
    startCommand: uv run python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PLAB_PUBLIC_DEMO
        value: "true"
      - key: PLAB_SESSION_TOKEN
        generateValue: true
      - key: PLAB_DAILY_RUN_LIMIT
        value: "100"
      - key: PLAB_DB_PATH
        value: /tmp/plab.sqlite3
      - key: PLAB_EVALUATION_PATH
        value: evals/results/initial-live-holdout.json
      - key: SOCLAAS_API_KEY
        sync: false
      - key: SOCLAAS_MODEL
        value: qwen3.8:27b
      - key: SOCLAAS_BASE_URL
        value: https://soclaas-api.comp.nus.edu.sg/v1
      - key: SOCLAAS_API_MODE
        value: chat_completions
