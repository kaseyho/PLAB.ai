[project]
name = "plab-backend"
version = "0.1.0"
description = "Bounded airport-agent coordination and human-review integration"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "types-openpyxl>=3.1,<4",
]

[tool.vercel]
entrypoint = "app.vercel:app"

[tool.vercel.scripts]
build = "python -m app.download_data"

[tool.vercel.fastapi.static]
cdn = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "examples"]
plugins = ["pydantic.mypy"]
